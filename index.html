<style>
/* One phone-width column. Home overview, Hours (pay periods, ranges, list/timeline), Paychecks, More (the live clock lives there). Green = regular, amber = overtime, blue = day off, purple = holiday credit, teal = paid leave. */
:root{
  --bg:#EDF0F2; --card:#FFFFFF; --ink:#131C24; --ink2:#56646F; --line:#D5DBE0;
  --go:#0E7C5F; --go-bg:#DAEFE6; --on-go:#FFFFFF;
  --off-bg:#DCE6F5; --off-fg:#2F5FA8; --hol-bg:#EADDF7; --hol-fg:#6B3FA0; --lv-bg:#D5EEF0; --lv-fg:#0F6E75;
  --ot:#A84B08; --ot-bg:#FBE6D1; --ot-bar:#D9792B;
  --stop:#1B2733; --on-stop:#FFFFFF; --bad:#B3261E; --field:#F6F8F9;
  --fd:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --fb:"Barlow Semi Condensed",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1318; --card:#151D24; --ink:#E8EEF2; --ink2:#93A2AE; --line:#26323B;
    --go:#3CC59A; --go-bg:#133A2E; --on-go:#06231A;
    --off-bg:#1B2C45; --off-fg:#8FB4F0; --hol-bg:#33224A; --hol-fg:#C7A6F0; --lv-bg:#123A3E; --lv-fg:#6FD0D6;
    --ot:#F0A35C; --ot-bg:#3E2913; --ot-bar:#E08A3C;
    --stop:#E8EEF2; --on-stop:#10171D; --bad:#FF8F85; --field:#1B252D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1318; --card:#151D24; --ink:#E8EEF2; --ink2:#93A2AE; --line:#26323B;
  --go:#3CC59A; --go-bg:#133A2E; --on-go:#06231A;
  --off-bg:#1B2C45; --off-fg:#8FB4F0; --hol-bg:#33224A; --hol-fg:#C7A6F0; --lv-bg:#123A3E; --lv-fg:#6FD0D6;
  --ot:#F0A35C; --ot-bg:#3E2913; --ot-bar:#E08A3C;
  --stop:#E8EEF2; --on-stop:#10171D; --bad:#FF8F85; --field:#1B252D; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.35 var(--fb);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{max-width:440px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(160px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
h1{font:600 36px/1 var(--fd);margin:2px 0 0;letter-spacing:.2px}
h2{font:600 13px/1 var(--fb);margin:0 0 10px;color:var(--ink2);letter-spacing:.6px;text-transform:uppercase}
.sub{color:var(--ink2);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.pill{display:inline-block;font-size:13px;font-weight:500;padding:4px 11px;border-radius:99px;background:var(--line);color:var(--ink2);white-space:nowrap}
.pill.go{background:var(--go-bg);color:var(--go)}
.pill.ot{background:var(--ot-bg);color:var(--ot)}
button.pill{border:0;min-height:44px;padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-size:15px;font-weight:500;min-height:44px}
.chip small{color:var(--ink2);font-weight:400;margin-left:4px}
.chip.on{border-color:var(--go);background:var(--go-bg);color:var(--go)}
.chip:disabled{cursor:default}
.clock{text-align:center;margin:22px 0 18px}
.tm{font:600 84px/1 var(--fd);font-variant-numeric:tabular-nums;letter-spacing:1px}
.tm span{font-size:36px;color:var(--ink2)}
.big{width:100%;height:76px;border:0;border-radius:20px;font:600 28px/1 var(--fd);letter-spacing:.4px}
.big.in{background:var(--go);color:var(--on-go)}
.big.out{background:var(--stop);color:var(--on-stop)}
.btn{width:100%;min-height:48px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-weight:500;margin-top:10px}
.btn.dim{color:var(--ink2)}
.btn.warn{color:var(--bad);border-color:var(--bad)}
.btn.solid{background:var(--go);color:var(--on-go);border-color:var(--go)}
.btn.bk{width:auto;padding:0 14px;min-height:44px;margin:0 0 10px}
.seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 8px;font-size:14px;font-weight:500;color:var(--ink2);min-height:44px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.fig{font:600 52px/1 var(--fd);font-variant-numeric:tabular-nums}
.fig small{font-size:22px;color:var(--ink2);margin-left:4px}
.meter{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);margin:12px 0 8px}
.meter i{display:block;height:100%}
.meter .r{background:var(--go)}.meter .o{background:var(--ot-bar)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;min-height:44px}
.row:last-child{border-bottom:0}
.day{width:44px;flex:none}
.day b{display:block;font:600 22px/1 var(--fd)}
.day span{font-size:13px;color:var(--ink2)}
.mid{flex:1;min-width:0;font-size:15px}
.mid .sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{text-align:right;flex:none}
.rt b{font:600 24px/1 var(--fd);font-variant-numeric:tabular-nums}
.rt .pill{margin-top:4px;font-size:12px;padding:2px 8px}
.empty{color:var(--ink2);font-size:15px;padding:18px 0;text-align:center}
.dl{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:15px;font-variant-numeric:tabular-nums}
.dl.t{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:600;font-size:17px}
.dl span:first-child{color:var(--ink2)}
.dl.t span:first-child{color:var(--ink)}
label.f{display:block;font-size:13px;color:var(--ink2);margin:14px 0 5px}
input,select,textarea{width:100%;height:46px;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:0 12px;font-size:16px}
textarea{height:70px;padding:10px 12px;resize:none}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--go);outline-offset:1px}
.two{display:flex;gap:10px}.two>div{flex:1;min-width:0}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:18px}
.pv{background:var(--field);border:1px dashed var(--line);border-radius:12px;padding:12px;margin-top:14px;font-size:15px;font-variant-numeric:tabular-nums}
.rr{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.rr input:first-child{flex:1}.rr .rate{width:96px;flex:none}
.rr button{flex:none;width:46px;height:46px;border:1px solid var(--line);background:var(--card);border-radius:10px;color:var(--ink2);font-size:18px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 4px}
.nav button{width:44px;height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:22px;flex:none}
.nav .mid2{flex:1;text-align:center;font:600 22px/1.1 var(--fd)}
.nav .mid2 small{display:block;font:400 13px var(--fb);color:var(--ink2);margin-top:2px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(440px,100%);display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px calc(4px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(4px + env(safe-area-inset-left,0px))}
.tabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--ink2);padding:6px 0;min-height:44px}
.tabs button.on{color:var(--go)}
.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--stop);color:var(--on-stop);padding:10px 16px;border-radius:12px;font-size:15px;max-width:90%;z-index:6}
.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--go);color:var(--on-go);border:0;border-radius:99px;padding:0 20px;min-height:44px;font-weight:600;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.foot{text-align:center;color:var(--ink2);font-size:12px;margin-top:22px}
.note{font-size:13px;color:var(--ink2);margin-top:6px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi .l{font-size:13px;color:var(--ink2)}
.kpi .v{font:600 34px/1.05 var(--fd);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .v small{font-size:16px;color:var(--ink2);margin-left:3px}
.kpi .d{font-size:12px;color:var(--ink2);margin-top:3px}
.kpi.ot .v{color:var(--ot)}
.bars{display:flex;gap:3px;align-items:flex-end;height:140px;margin-top:6px}
.bc{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;border:0;background:transparent;padding:0}
.bc em{font:500 11px var(--fb);color:var(--ink2);font-style:normal;height:14px;line-height:14px}
.bc .b{width:100%;display:flex;flex-direction:column;border-radius:4px 4px 0 0;overflow:hidden}
.bc .b i{display:block}
.bc .b .r{background:var(--go)}.bc .b .o{background:var(--ot-bar)}
.bl{display:flex;gap:3px;margin-top:4px}
.bl span{flex:1;text-align:center;font-size:11px;color:var(--ink2)}
.bl span.td{color:var(--ink);font-weight:600}
.lg{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:10px;flex-wrap:wrap}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.pg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.pg .wd{font-size:11px;color:var(--ink2);text-align:center}
.pc{height:44px;border-radius:8px;border:1px solid var(--line);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1.1}
.pc small{font-size:11px;color:var(--ink2)}
.pc b{font:600 15px var(--fd)}
.pc{position:relative}
.pc.m{border-color:transparent;color:var(--ink)}
.pc.f{border-style:dashed}
.pc.x{visibility:hidden}
.pc.un{border:1.5px dashed var(--bad)}
.pc.nw{background:var(--field)}
.pc .mu{font-weight:500;font-size:12px;color:var(--ink2)}
.pc u{position:absolute;top:2px;right:3px;font:700 11px var(--fb);text-decoration:none;background:var(--go);color:var(--on-go);border-radius:6px;padding:0 4px;line-height:15px}
.pc.td{outline:2px solid var(--ink);outline-offset:1px}
.pc.bt{min-height:62px;height:auto;padding:3px 0}.pc i{font:400 11px var(--fb);font-style:normal}
.pbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:12px}
.pbar i{display:block;height:100%;background:var(--go)}
.rng{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:2px}
.rng button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;color:var(--ink2);min-height:44px}
.rng button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.wh{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink2);padding:12px 0 6px;border-bottom:1px solid var(--line)}
.wh b{color:var(--ink);font-weight:600}
.tl{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;min-height:44px}
.tl.mt{cursor:default}
.tl .dn{width:42px;flex:none;font-size:13px;color:var(--ink2);line-height:1.1}
.tl .dn b{color:var(--ink);font:600 15px var(--fd);display:block}
.tl .tr{flex:1;min-width:0;height:26px;border-radius:6px;position:relative;background:linear-gradient(to right,transparent 24.8%,var(--line) 25%,transparent 25.2%,transparent 49.8%,var(--line) 50%,transparent 50.2%,transparent 74.8%,var(--line) 75%,transparent 75.2%),var(--field)}
.tl .sh{position:absolute;top:3px;bottom:3px;border-radius:5px;overflow:hidden;display:flex}
.tl .sh i{display:block;height:100%}
.tl .sh .r{background:var(--go)}.tl .sh .o{background:var(--ot-bar)}
.tl .hr{flex:none;text-align:right;font:600 16px var(--fd);font-variant-numeric:tabular-nums}
.tl .hr.z{color:var(--ink2);font-weight:400}
.ax{display:flex;gap:8px;margin-top:10px;font-size:11px;color:var(--ink2)}
.ax .sp{width:42px;flex:none}.ax .sc{flex:1;position:relative;height:14px}.ax .sc span{position:absolute;transform:translateX(-50%)}.ax .sc span:first-child{transform:none}.ax .hr{flex:none}
.tl .hr,.ax .hr{width:54px}
.hr em{font:400 12px var(--fb);font-style:normal;color:var(--ink2)}
.live{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--go-bg);color:var(--go);border-radius:14px;padding:12px 14px;margin-bottom:4px;font-weight:500;cursor:pointer;min-height:44px}
.seg.t3{flex:none}.seg.t3 button{flex:none;padding:6px 11px}
.alert{display:block;background:var(--ot-bg);color:var(--ot);border-radius:14px;padding:12px 14px;margin-bottom:12px;cursor:pointer}
.alert b{display:block;font-weight:600}.alert span{font-size:14px}
.okbox{background:var(--go-bg);color:var(--go);border-radius:14px;padding:12px 14px;margin-top:14px}
.warnc{border-color:var(--ot)}
.why{font-size:15px;padding:8px 0;border-bottom:1px solid var(--line)}.why:last-child{border-bottom:0}
.esc{margin-top:14px;font-size:14px;color:var(--ink2)}.esc ol{margin:6px 0 0 18px;padding:0}.esc b{color:var(--ink)}
.lnk{display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.lines{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.job{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.kind{margin:-2px 0 12px}
.kind select{margin-top:6px}
.bl.b2{margin-top:2px}
.bl.bd{margin-top:0}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;margin-top:6px;font-size:15px;cursor:pointer}
.chk input{width:22px;height:22px;flex:none}
.sg{display:grid;grid-template-columns:48px 1fr 1fr 58px 44px;gap:6px;align-items:center;margin-bottom:6px}
.sg input{height:44px;padding:0 6px;font-size:15px;min-width:0}
.sg .ck{display:flex;align-items:center;justify-content:center;min-height:44px;cursor:pointer}
.sg .ck input{width:22px;height:22px}
.sg.hdr span{font-size:12px;color:var(--ink2)}
.sd{font-size:13px;color:var(--ink2);line-height:1.1}.sd b{display:block;color:var(--ink);font:600 16px var(--fd)}
.dchips{display:flex;gap:6px}
.dchips button{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 0;font-size:14px;font-weight:500;color:var(--ink2);min-height:44px}
.dchips button.on{background:var(--ot-bg);border-color:transparent;color:var(--ot)}
.file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
/* V1.1: the + button, the "Nothing logged" card, big time fields, legends, pay period cards, day tags. */
.fab{position:fixed;right:max(16px,calc((100vw - 440px)/2 + 16px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--go);color:var(--on-go);font:500 38px/1 var(--fd);display:flex;align-items:center;justify-content:center;padding:0 0 4px;box-shadow:0 0 0 4px var(--bg);z-index:4}
.log{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--go-bg);color:var(--go);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.log b{display:block;font-weight:600}.log span{font-size:14px}
.log .lgb{display:flex;flex-direction:column;gap:6px;flex:none}
.log button{border:0;background:var(--go);color:var(--on-go);border-radius:10px;padding:0 14px;min-height:44px;font-weight:600}
.log button.alt{background:transparent;color:var(--go);border:1px solid var(--go)}
.bt input{height:60px;font:600 32px var(--fd);text-align:center;letter-spacing:1px}
.lgd{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:12px;color:var(--ink2)}
.lgd i.s{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:5px;vertical-align:-3px;font-style:normal}
.lgd i.r{background:var(--go-bg);border:1px solid var(--go)}.lgd i.o{background:var(--ot-bg);border:1px solid var(--ot)}
.lgd i.od{background:var(--off-bg)}.lgd i.hl{background:var(--hol-bg)}.lgd i.lv{background:var(--lv-bg)}
.lgd i.un{border:1.5px dashed var(--bad)}.lgd i.nw{background:var(--field);border:1px solid var(--line)}
.lgd i.pdy{background:var(--go);color:var(--on-go);font:700 10px/14px var(--fb);text-align:center}
.lgd i.ma{background:linear-gradient(135deg,var(--off-bg) 50%,var(--hol-bg) 50%)}
.lgd i.mb{background:linear-gradient(135deg,var(--off-bg) 50%,var(--ot-bg) 50%)}
.lgd i.mc{background:linear-gradient(135deg,var(--lv-bg) 50%,var(--ot-bg) 50%)}
.bc .b .c{background:var(--hol-fg)}.bc .b .v{background:var(--lv-fg)}
.bl.bd span.pdy{background:var(--go);color:var(--on-go);border-radius:7px;font-weight:700}
.pcard{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;min-height:44px}
.pcard.on{border-color:var(--go);box-shadow:0 0 0 1px var(--go)}
.pcard b{display:block;font:600 20px var(--fd)}.pcard span{font-size:13px;color:var(--ink2)}
.pcard .r{text-align:right;flex:none}.pcard .r b{font-size:22px}.pcard .r .pill{margin-top:4px}
.pill.hol{background:var(--hol-bg);color:var(--hol-fg)}.pill.lv{background:var(--lv-bg);color:var(--lv-fg)}
.btn.big2{min-height:54px;font-size:18px}
/* V1.2.1: behave like an app: no double-tap zoom, no text-selection callouts on the controls. */
html{touch-action:manipulation}
body{-webkit-touch-callout:none}
button,[role="button"],nav,.row,.pcard,.pc,.chip{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
</style>
</head>

<div class="app"><main id="main"><div class="empty">Loading your records…</div></main></div>

<script id="model">

function newRules(pp){var t=ymd(now());return {mode:'auto',thr:40,mult:1.5,ws:1,dOn:false,dHrs:8,wOn:true,offOT:true,off:{sched:[{from:'2000-01-01',days:[]}],next:''},hol:{on:true,list:[]},guar:0,bank:{on:false,cap:80,bal:80,date:t},pp:pp||{type:'biweekly',anchor:t,lag:7},third:false};}

/* Stored-data versions. Unversioned state is the V1 shape. Version 2 adds schemaVersion and marks (days marked

function migrate(s){
  if(!s||typeof s!=='object')return null;
  var v=s.schemaVersion==null?1:+s.schemaVersion;

}
/* Fill in anything a stored, imported or brand-new state is missing. Generic defaults only. */

}
function fresh(){return norm({jobs:[{id:'j1',name:'My job'}],roles:[{id:'r1',job:'j1',name:'Regular work',rate:0,kind:'work',ot:true}]});}

function wmin(e){var d=tmin(e.e)-tmin(e.s)-(+e.b||0);if(tmin(e.e)<=tmin(e.s))d+=1440;return Math.max(0,d);}
function wh(e){return e.liveH!=null?e.liveH:wmin(e)/60;}

function entryErr(E){if(!E.date||!E.s||!E.e)return 'Enter a date, start time, and end time.';if(!tvalid(E.s)||!tvalid(E.e))return 'Use 24-hour time, like 14:00.';if(wmin(E)<=0)return 'Those times leave no paid time. Check the break.';if(E.ot!=null&&E.ot>wmin(E)/60)return 'Overtime can\'t be more than the hours worked.';return '';}

function tot(rows){var T={worked:0,ot:0,otPh:0,reg:0,ph:0,adj:0,usd:0,fed:0,prem:0,regUsd:0,otUsd:0,leaveUsd:0,compUsed:0,xtra:0,xtraUsd:0,workReg:0},dy={};rows.forEach(function(r){T.worked+=r.hol?0:r.w;T.workReg+=r.workReg;T.ot+=r.ot;T.otPh+=r.otPh;T.reg+=r.w-r.ot-r.xtra;T.xtra+=r.xtra;T.xtraUsd+=r.xtra*r.rate;T.ph+=r.ph;T.adj+=(+r.e.adj||0);T.usd+=r.usd;T.regUsd+=(r.w-r.ot-r.xtra)*r.rate;T.otUsd+=r.otUsd;T.leaveUsd+=r.leaveUsd;T.compUsed+=r.compUsed;T.fed+=r.fed;T.prem+=r.fed*r.rate*0.5;if(r.w>0&&!r.hol)dy[r.e.date]=1;});T.nd=Object.keys(dy).length;return T;}
/* Rows for days s..e. Six days before s are included in the calculation so a week's running overtime count is right. repl swaps a job's entries in lo..hi for a draft list (the timesheet). */

function periodOf(d,jid){
  var P=jid?jr(jid).pp:A.set.pp,len={weekly:7,biweekly:14,fourweek:28}[P.type],s,e;

function periodShift(p,n,jid){var q=p;while(n>0){q=periodOf(addD(q.e,1),jid);n--;}while(n<0){q=periodOf(addD(q.s,-1),jid);n++;}return q;}

function holIdx(jid,date){var H=jr(jid).hol;if(!H||!H.list)return -1;for(var i=0;i<H.list.length;i++)if(H.list[i].d===date)return i;return -1;}

  var R=jr(jid),H=R.hol||(R.hol={on:true,list:[]}),i=holIdx(jid,date);
  if(on){if(i<0)H.list.push({d:date,n:name||'Holiday'});else if(name)H.list[i].n=name;H.on=true;}
  else if(i>=0)H.list.splice(i,1);

/* Run fn with draft holiday ticks applied, then put the saved list back. */
function holWith(jid,items,fn){
  var R=jr(jid),bak=JSON.stringify(R.hol||{on:true,list:[]}),r;
  try{items.forEach(function(x){syncHol(jid,x.d,x.hol,x.n);});r=fn();}finally{R.hol=JSON.parse(bak);}
  return r;
}
function offDays(jid,date){var O=jr(jid).off,d=[];if(!O||!O.sched)return d;O.sched.slice().sort(function(a,b){return a.from<b.from?-1:a.from>b.from?1:0;}).forEach(function(x){if(x.from<=date)d=x.days;});return d;}
function isOff(jid,date){return offDays(jid,date).indexOf(pd(date).getDay())>=0;}
function holPick(jid,dayOff){
  var rs=A.roles.filter(function(x){return x.job===jid&&x.kind==='leave';});
  if(dayOff)return rs.filter(function(x){return x.extra;})[0]||null;
  return rs.filter(function(x){return !x.extra&&!x.bank&&/holiday/i.test(x.name);})[0]||rs.filter(function(x){return !x.extra&&!x.bank;})[0]||null;
}
function holidayRows(a,z,jf){
  var out=[];
  A.jobs.forEach(function(j){
    if(jf&&j.id!==jf)return;var H=j.rules.hol;if(!H||H.on===false)return;
    H.list.forEach(function(x){
      if(x.d<a||x.d>z)return;var off=isOff(j.id,x.d),r=holPick(j.id,off);if(!r)return;
      out.push({id:'hol-'+x.d+'-'+j.id,date:x.d,s:'00:00',e:pad(HOL_H)+':00',b:0,role:r.id,ot:null,adj:0,note:x.n+(off?' fell on a day off: '+HOL_H+' h straight comp credit':': '+HOL_H+' h holiday credit'),hol:true});
    });
  });

function baseRate(jid){var r=A.roles.filter(function(x){return x.job===jid&&x.kind==='work';})[0];return r?r.rate:0;}
function isThird(d,jid){var P=jr(jid||curJob().id).pp;return P.type==='biweekly'&&d.getDate()>=29;}
/* A third payday only changes the take-home estimate when the job says some deductions skip it. */
function thirdSkip(d,jid){jid=jid||curJob().id;return !!jr(jid).third&&isThird(d,jid);}
function bankBefore(p,jid){

function periodAdj(T,p,jid){
  var R=jr(jid),rate=baseRate(jid),over=ymd(now())>ymd(p.e);
  T.gTop=0;T.refill=0;T.bankUsd=0;T.otCash=T.ot;T.xtraCash=T.xtra;T.regDiv=0;
  if(R.guar>0&&over){var tu=Math.max(0,R.guar-T.reg);if(tu>0){T.gTop=tu;T.reg+=tu;T.regUsd+=tu*rate;T.ph+=tu;T.usd+=tu*rate;}}

function stubBases(s){var L=s.lines||{},G=s.gross,ben=+L.ben||0,life=+L.life||0;return {fica:G-ben+life,fed:G-ben-(+L.dc||0)-(+L.pers||0)+life};}
/* Take-home model fitted to the given stubs: percent lines as average ratios, fixed lines as averages, federal by least squares. */

  L.push(M?['Learned from '+M.n+' paystub'+(M.n>1?'s':''),'Each deduction is an average of what your stubs show, and federal withholding is a straight line fitted to them. More stubs make it tighter.']:['No paystubs yet','Add a paystub and the app learns what comes out of each check.']);
  if(R.mode==='auto'){if(R.dOn)ot.push('after '+R.dHrs+' h in a day');if(R.wOn!==false)ot.push('after '+R.thr+' h in a work week');}
  L.push(['Overtime',R.mode==='auto'?(ot.length?'Pays '+R.mult+'x '+ot.join(' and ')+'. Paid leave never counts toward it.':'No automatic rule is on.'):'You choose the overtime hours on each day.']);
  if(od.length&&R.offOT!==false)L.push(['Days off','Work on '+od.map(function(d){return DN[d];}).join(' and ')+' is all overtime at '+R.mult+'x, even a short shift.']);
  if(R.guar>0)L.push(['Guarantee',R.guar+' regular hours each pay period, paid leave included. A finished period below that is topped up at the straight rate.']);
  if(R.bank&&R.bank.on)L.push(['Comp bank (AC)','Holds at most '+R.bank.cap+' hours. After you use bank hours, the first hours you work refill it (regular first) and are not paid in cash.']);
  if(R.hol&&R.hol.on!==false)L.push(['Holidays','Each holiday gives an '+HOL_H+' hour credit: straight comp on a day off, or the day\'s regular hours on a work day, after which anything you work is overtime.']);
  if(R.third)L.push(['Third paydays (assumed)','A pay date on the 29th or later skips the benefit fee, deferred compensation and insurance, so take-home runs higher. The range is wider until a stub confirms it.']);
  L.push(['Not covered','Premiums and other extras are manual adjustments on the day. The app estimates; it is not tax or payroll advice.']);
  return L;
}

function impSummary(s){var hol=0;(s.jobs||[]).forEach(function(j){hol+=j.rules&&j.rules.hol&&Array.isArray(j.rules.hol.list)?j.rules.hol.list.length:0;});return (s.jobs||[]).length+' job'+((s.jobs||[]).length===1?'':'s')+', '+(s.roles||[]).length+' work types, '+hol+' holidays, '+(s.stubs||[]).length+' paystubs, '+(s.entries||[]).length+' logged days';}
function impApply(){
  var I=U.imp;if(!I)return;var st=norm(I.state);
  if(I.kind==='setup'){mergeSetup(st,A);st.sess=null;st.set.created=A.set.created;st.set.lastExport=A.set.lastExport;}
  useState(st);U.job='all';U.cust={};U.role=firstWork();U.imp=null;save();render();toast(I.kind==='setup'?'Setup imported':'Backup restored');
}
function impCancel(){U.imp=null;render();}
function impAdds(st){var n=(st.entries||[]).length;if(!n)return '';var x=norm(JSON.parse(JSON.stringify(st))),k=mergeSetup(x,{entries:A.entries,marks:A.marks});return ' The file also has '+n+' logged day'+(n>1?'s':'')+': '+(k===n?(n>1?'all are':'it is')+' added.':k?k+' are added, the rest are dates you already have.':'none are added, you already have '+(n>1?'those dates':'that date')+'.');}
function vExport(){
  var r=exRange(),txt=exText(),p=periodOf(now()),opts='';
  for(var i=0;i>=-6;i--){var q=periodShift(p,i);opts+='<option value="'+i+'"'+(U.ex.pp===i?' selected':'')+'>'+fmtD(q.s)+' to '+fmtD(q.e)+(i===0?' (current)':'')+'</option>';}
  var h=bk()+'<header class="top"><div><div class="sub">Share or keep a record</div><h1>Export</h1></div></header>';
  h+='<section class="card" style="margin-top:0"><label class="f" style="margin-top:0">What to export</label>'+seg([['range','Hours range'],['pp','Pay period'],['year','Whole year']],U.ex.src,'exSrc');
  if(U.ex.src==='pp')h+='<label class="f" for="x-pp">Pay period</label><select id="x-pp" onchange="exSet(\'pp\',this.value)">'+opts+'</select>';
  h+='<div class="note">'+esc(r.lab)+'</div><label class="f">Format</label>'+seg([['text','Readable text'],['csv','CSV (spreadsheet)']],U.ex.fmt,'exFmt');
  h+='<label class="f" for="x-out">Preview</label><textarea id="x-out" style="height:260px;font:13px/1.4 var(--fb);white-space:pre" readonly>'+esc(txt)+'</textarea>';
  h+='<button class="btn solid" onclick="exShare()">Share or save as a file</button><button class="btn" onclick="copyTxt(document.getElementById(\'x-out\').value,\'x-out\',\'Copied\')">Copy to clipboard</button></section>';
  h+='<section class="card"><h2>Backup</h2><div class="note" style="margin:-4px 0 8px">One file with everything: days, rules and paystubs. Save it to Files, Mail or iCloud. Last backup: '+(A.set.lastExport?fmtDY(new Date(A.set.lastExport)):'never')+'.</div><button class="btn solid" onclick="saveBackup()">Save a backup file</button><button class="btn" onclick="saveSetup()">Save a setup file (rules and paystubs, no days)</button></section>';
  h+='<section class="card" id="impc"><h2>Import</h2>';
  if(U.imp){var I=U.imp;h+='<div class="alert" style="cursor:default"><b>'+(I.kind==='setup'?'Use this setup file?':'Restore this backup?')+'</b><span>'+esc(I.name)+': '+impSummary(I.state)+'.</span></div><div class="note">'+(I.kind==='setup'?'This replaces your jobs, work types, rules, holidays, contacts and paystubs. Your '+A.entries.length+' logged days stay.'+impAdds(I.state):'This replaces everything on this phone ('+A.entries.length+' days, '+A.stubs.length+' paystubs) with the backup.')+'</div><button class="btn solid" id="imp-ok" onclick="impApply()">'+(I.kind==='setup'?'Replace my setup':'Replace everything')+'</button><button class="btn" onclick="impCancel()">Cancel</button>';}
  else h+='<div class="note" style="margin:-4px 0 8px">Open a backup or a setup file someone sent you. The app shows what is in it and asks before replacing anything.</div><label class="btn lnk" for="imp-file" role="button" tabindex="0" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();this.click();}">Choose a file</label><input class="file" id="imp-file" type="file" accept=".json,application/json" onchange="impRead(this)" aria-label="Backup or setup file">';
  h+='</section>';
  return h+foot();
}
function exSrc(v){U.ex.src=v;render();}
function exFmt(v){U.ex.fmt=v;render();}

/* Timesheet editor */
function openSheet(s,e,jid){
  var n=dd(s,e)+1;if(n>21){toast('Pick a range of 3 weeks or less');return;}
  jid=jid||curJob().id;
  var lo=ymd(s),hi=ymd(e),rows=[],keep=[],seen={};
  var inR=A.entries.filter(function(x){return x.date>=lo&&x.date<=hi&&roleJob(x.role)===jid;}).sort(function(x,y){return x.date<y.date?-1:x.date>y.date?1:(x.s<y.s?-1:1);});
  inR.forEach(function(x){if(seen[x.date])keep.push(x);else seen[x.date]=x;});
  for(var i=0;i<n;i++){var k=ymd(addD(s,i)),x=seen[k];rows.push({hol:holIdx(jid,k)>=0,date:k,id:x?x.id:null,s:x?x.s:'',e:x?x.e:'',b:x?x.b:'',role:x?x.role:'',o:x?JSON.parse(JSON.stringify(x)):null,more:keep.filter(function(y){return y.date===k;}).length});}
  var st=null,p=periodOf(s,jid);
  if(ymd(p.s)===lo&&ymd(p.e)===hi)st=stubFor(lo,jid);
  U.sh={s:lo,e:hi,job:jid,rows:rows,keep:keep,role:firstWork(jid),gross:st?String(Math.round(st.gross*100)/100):'',hrs:st&&st.hrs!=null?String(Math.round(st.hrs*100)/100):'',ot:st&&st.othrs!=null?String(Math.round(st.othrs*100)/100):''};
  U.from=U.tab;U.tab='sheet';render();window.scrollTo(0,0);
}
function sheetThis(){var R=range();openSheet(R.s,R.e,curJob().id);}
function sheetPeriod(){var p=periodOf(pd(U.chk));openSheet(p.s,p.e,curJob().id);}
function readSh(){
  var Z=U.sh,g=function(i){var x=document.getElementById(i);return x?x.value:null;};
  if(!document.getElementById('sh-s-0'))return;
  Z.rows.forEach(function(r,i){r.s=tfix(g('sh-s-'+i)||'');r.e=tfix(g('sh-e-'+i)||'');r.b=g('sh-b-'+i);if(r.b==null)r.b='';var hc=document.getElementById('sh-h-'+i);if(hc)r.hol=hc.checked;});
  var a=g('sh-role');if(a)Z.role=a;Z.gross=g('sh-gross')||'';Z.hrs=g('sh-hrs')||'';Z.ot=g('sh-ot')||'';
}
function shDraft(){
  readSh();var Z=U.sh,list=[],err='';
  Z.rows.forEach(function(r,i){
    if(!r.s&&!r.e)return;var d=pd(r.date),lab=DN[d.getDay()]+' '+fmtD(d);
    if(!(r.s&&r.e)){err=err||lab+': enter both a start and an end time.';return;}
    if(!tvalid(r.s)||!tvalid(r.e)){err=err||lab+': use 24-hour time, like 14:00.';return;}
    var o=r.o,e={id:r.id||('sh'+i),date:r.date,s:r.s,e:r.e,b:(r.b===''||r.b==null)?A.set.brk:(parseFloat(r.b)||0),role:r.role||Z.role,ot:o?o.ot:null,adj:o?o.adj:0,note:o?o.note:''};
    if(wmin(e)<=0){err=err||lab+': those times leave no paid time. Check the break.';return;}
    list.push(e);
  });
  return {list:list.concat(Z.keep),err:err};
}
function shRows(){var d=shDraft(),Z=U.sh;return {err:d.err,rows:holWith(Z.job,Z.rows.map(function(r){return {d:r.date,hol:!!r.hol,n:'Holiday'};}),function(){return rowsFor(pd(Z.s),pd(Z.e),null,null,Z.job,{lo:Z.s,hi:Z.e,job:Z.job,list:d.list});})};}
function shTotals(){
  var el=document.getElementById('shT');if(!el)return;
  var x=shRows(),T=tot(x.rows),Z=U.sh,h='',pp1=periodOf(pd(Z.s),Z.job);
  if(ymd(pp1.s)===Z.s&&ymd(pp1.e)===Z.e)periodAdj(T,pp1,Z.job);
  var otc=T.otCash!=null?T.otCash:T.ot;
  if(x.err)h+='<div class="err" role="alert">'+esc(x.err)+'</div>';
  h+='<div class="dl"><span>Hours worked</span><span>'+nm(T.worked)+' h</span></div><div class="dl"><span>Overtime</span><span>'+nm(T.ot)+' h → '+nm(T.otPh)+' paid h</span></div><div class="dl"><span>Paid hours</span><span>'+nm(T.ph)+' h</span></div><div class="dl t"><span>Gross pay (app)</span><span>'+usd(T.usd)+'</span></div>';
  var M=null;if(Z.job===curJob().id)M=model();
  if(M)h+='<div class="dl"><span>Take-home (app)</span><span>'+usd0(netOf(T))+'</span></div>';
  var g=num(Z.gross),hp=num(Z.hrs),op=num(Z.ot);
  if(g!=null){var df=g-T.usd,ok=Math.abs(df)<=1;h+='<div class="'+(ok?'okbox':'alert')+'" style="cursor:default;margin-top:12px"><b>'+(ok?'The app matches the stub.':'Stub is '+usd(Math.abs(df))+(df<0?' lower':' higher')+' than the app.')+'</b>'+(ok?'':'<span>Compare the hours and the overtime hours below to find where it splits.</span>')+'</div>';}
  if(hp!=null)h+='<div class="note">Regular hours: stub '+nm(hp)+' h, app '+nm(T.reg)+' h ('+(hp-T.reg>=0?'+':'')+nm(hp-T.reg)+' h).</div>';
  if(op!=null)h+='<div class="note">Overtime hours: stub '+nm(op)+' h, app '+nm(otc)+' h ('+(op-otc>=0?'+':'')+nm(op-otc)+' h).</div>';
  h+='<div class="note" style="margin-top:12px"><b style="color:var(--ink)">The math, day by day</b></div>';
  x.rows.forEach(function(r){
    var d=pd(r.e.date),line=nm(r.w-r.ot)+' h × '+usd(r.rate);
    if(r.ot>0)line+=' + '+nm(r.ot)+' h × '+r.mult+' × '+usd(r.rate);
    if(+r.e.adj)line+=' + '+usd(+r.e.adj);
    h+='<div class="why"><b>'+DN[d.getDay()]+' '+fmtD(d)+'</b> · '+nm(r.w)+' h'+(r.e.hol?' (holiday credit)':'')+'<br><span class="sub">'+line+' = <b style="color:var(--ink)">'+usd(r.usd)+'</b></span></div>';
  });
  el.innerHTML=h;
}
function shUp(){shTotals();}
function shFill(){
  readSh();var Z=U.sh,t=null;Z.rows.forEach(function(r){if(!t&&r.s&&r.e)t=r;});
  if(!t){toast('Fill in one day first');return;}
  var n=0;Z.rows.forEach(function(r){var wd=pd(r.date).getDay();if(!r.s&&!r.e&&wd>=1&&wd<=5){r.s=t.s;r.e=t.e;r.b=t.b;n++;}});
  render();toast(n?'Filled '+n+' empty weekday'+(n>1?'s':''):'No empty weekdays to fill');
}
function shBack(){if(U.from==='check'&&U.chk)openCheck(U.chk);else{U.tab=U.from&&U.from!=='sheet'?U.from:'hours';render();}}
function shSave(){
  var d=shDraft();if(d.err){toast(d.err);return;}
  var Z=U.sh,ids={},keepIds={},stamp=Date.now();Z.rows.forEach(function(r){if(r.id)ids[r.id]=1;});Z.keep.forEach(function(k){keepIds[k.id]=1;});
  A.entries=A.entries.filter(function(x){return !ids[x.id];});
  d.list.forEach(function(e,i){if(keepIds[e.id])return;if(/^sh\d/.test(e.id))e.id='e'+stamp+'-'+i;A.entries.push(e);unmark(e.date);});
  Z.rows.forEach(function(r){var i=holIdx(Z.job,r.date);if(r.hol&&i<0)syncHol(Z.job,r.date,true,'Holiday');else if(!r.hol&&i>=0)syncHol(Z.job,r.date,false);});
  save();shBack();toast('Timesheet saved');
}
function vSheet(){
  var Z=U.sh,j=jobOf(Z.job)||A.jobs[0],h='<button class="btn dim bk" onclick="shBack()">&#8249; Back</button>';
  h+='<header class="top"><div><div class="sub">'+fmtD(pd(Z.s))+' to '+fmtD(pd(Z.e))+(A.jobs.length>1?' · '+esc(j.name):'')+'</div><h1>Timesheet</h1></div></header>';
  h+='<div class="note" style="margin:-6px 0 10px">Type the real start and end times for each day in 24-hour time. The totals and the math update as you type. Leave a day blank for no work.</div>';
  h+='<section class="card" style="margin-top:0" id="shT" aria-live="polite"></section>';
  h+='<section class="card"><h2>Compare with the paystub</h2><div class="two"><div><label class="f" for="sh-gross" style="margin-top:0">Gross pay on stub</label><input id="sh-gross" type="number" inputmode="decimal" step="0.01" value="'+esc(Z.gross)+'" oninput="shUp()"></div><div><label class="f" for="sh-hrs" style="margin-top:0">Regular hours on stub</label><input id="sh-hrs" type="number" inputmode="decimal" step="0.01" value="'+esc(Z.hrs)+'" oninput="shUp()"></div></div><div class="two"><div><label class="f" for="sh-ot">Overtime hours on stub</label><input id="sh-ot" type="number" inputmode="decimal" step="0.01" value="'+esc(Z.ot||'')+'" oninput="shUp()"></div><div></div></div></section>';
  h+='<section class="card"><h2>Days</h2><label class="f" for="sh-role" style="margin-top:0">Work type for new days</label><select id="sh-role" onchange="shUp()">'+A.roles.filter(function(r){return r.job===Z.job;}).map(function(r){return '<option value="'+r.id+'"'+(r.id===Z.role?' selected':'')+'>'+esc(r.name)+'</option>';}).join('')+'</select>';
  h+='<div class="sg hdr" style="margin-top:14px"><span></span><span>Start</span><span>End</span><span>Break</span><span>Hol.</span></div>';
  Z.rows.forEach(function(r,i){
    var d=pd(r.date),lab=DN[d.getDay()]+' '+fmtD(d);
    h+='<div class="sg"><div class="sd"><b>'+DN[d.getDay()]+'</b>'+fmtD(d)+'</div>'+tin('sh-s-'+i,r.s,'shUp()','Start time, 24 hour, '+lab)+tin('sh-e-'+i,r.e,'shUp()','End time, 24 hour, '+lab)+'<input id="sh-b-'+i+'" type="number" inputmode="numeric" min="0" placeholder="'+A.set.brk+'" value="'+(r.b===''||r.b==null?'':r.b)+'" oninput="shUp()" aria-label="Break minutes, '+lab+'"><label class="ck"><input id="sh-h-'+i+'" type="checkbox"'+(r.hol?' checked':'')+' onchange="shUp()" aria-label="Holiday, '+lab+'"></label></div>';
    if(r.more)h+='<div class="note" style="margin:-2px 0 8px">'+r.more+' more shift'+(r.more>1?'s':'')+' this day stay as they are. Edit them from Hours.</div>';
  });
  h+='<button class="btn" onclick="shFill()">Fill empty weekdays like the first day</button></section>';
  h+='<button class="btn solid" onclick="shSave()">Save timesheet</button>';
  return h;
}
function render(){
  if(!A)return;
  var m=document.getElementById('main'),t=U.tab,h;
  if(t==='home')h=vHome();else if(t==='clock')h=vClock();else if(t==='hours')h=vHours();else if(t==='edit')h=vEdit();else if(t==='pay')h=vPaychecks();else if(t==='check')h=vCheck();else if(t==='sheet')h=vSheet();
  else h=U.sub==='rules'?vRules():U.sub==='tax'?vTax():U.sub==='export'?vExport():vMore();
  m.innerHTML=h;
  var act=t==='edit'?(U.from||'hours'):t==='check'?'pay':t==='sheet'?(U.from==='check'?'pay':(U.from||'hours')):t;
  if(act==='clock')act='more';
  ['home','hours','pay','more'].forEach(function(k){var b=document.getElementById('tb-'+k);b.className=act===k?'on':'';if(act===k)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
  if(t==='edit')edPrev();
  if(t==='sheet')shTotals();
}
document.addEventListener('keydown',function(e){var t=e.target;if((e.key==='Enter'||e.key===' ')&&t&&t.getAttribute&&t.getAttribute('role')==='button'&&t.tagName!=='BUTTON'&&t.tagName!=='LABEL'){e.preventDefault();t.click();}});
setInterval(function(){if(A&&U.tab==='clock'&&A.sess){var a=document.getElementById('tm'),w=document.getElementById('wk');if(a&&w&&!document.activeElement.matches('input,select,textarea')){a.innerHTML=tmHtml();w.innerHTML=wkCard();}}},1000);
boot();
