<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="app-build-id" content="2026-10-15-V2">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Nurri's Tracker</title>
<meta name="description" content="Log your hours in 24-hour time, see your pay the way your stubs work it out, and check every paycheck.">
<meta name="theme-color" content="#EDF0F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1318" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nurri's">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap">
<style>
/* One phone-width column. Home is the summary, Shifts lists every shift (hours only), Pay holds the money, More the settings. One colour per meaning: green = regular, orange = overtime, blue = day off, purple = holiday credit, pink = paid leave, red dashed = not logged, dark badge = payday. */
:root{
  --bg:#EDF0F2; --card:#FFFFFF; --ink:#131C24; --ink2:#56646F; --line:#D5DBE0;
  --go:#0E7C5F; --go-bg:#DAEFE6; --on-go:#FFFFFF;
  --off-bg:#DCE6F5; --off-fg:#2F5FA8; --hol-bg:#EADDF7; --hol-fg:#6B3FA0; --lv-bg:#F8DCE8; --lv-fg:#A3365F;
  --ot:#A84B08; --ot-bg:#FBE6D1; --ot-bar:#D9792B;
  --stop:#1B2733; --on-stop:#FFFFFF; --bad:#B3261E; --field:#F6F8F9;
  --fd:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --fb:"Barlow Semi Condensed",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1318; --card:#151D24; --ink:#E8EEF2; --ink2:#93A2AE; --line:#26323B;
    --go:#3CC59A; --go-bg:#133A2E; --on-go:#06231A;
    --off-bg:#1B2C45; --off-fg:#8FB4F0; --hol-bg:#33224A; --hol-fg:#C7A6F0; --lv-bg:#45202F; --lv-fg:#F29BBE;
    --ot:#F0A35C; --ot-bg:#3E2913; --ot-bar:#E08A3C;
    --stop:#E8EEF2; --on-stop:#10171D; --bad:#FF8F85; --field:#1B252D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1318; --card:#151D24; --ink:#E8EEF2; --ink2:#93A2AE; --line:#26323B;
  --go:#3CC59A; --go-bg:#133A2E; --on-go:#06231A;
  --off-bg:#1B2C45; --off-fg:#8FB4F0; --hol-bg:#33224A; --hol-fg:#C7A6F0; --lv-bg:#45202F; --lv-fg:#F29BBE;
  --ot:#F0A35C; --ot-bg:#3E2913; --ot-bar:#E08A3C;
  --stop:#E8EEF2; --on-stop:#10171D; --bad:#FF8F85; --field:#1B252D; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.35 var(--fb);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
.app{max-width:440px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(160px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
h1{font:600 36px/1 var(--fd);margin:2px 0 0;letter-spacing:.2px}
h2{font:600 13px/1 var(--fb);margin:0 0 10px;color:var(--ink2);letter-spacing:.6px;text-transform:uppercase}
.sub{color:var(--ink2);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.pill{display:inline-block;font-size:13px;font-weight:500;padding:4px 11px;border-radius:99px;background:var(--line);color:var(--ink2);white-space:nowrap}
.pill.go{background:var(--go-bg);color:var(--go)}
.pill.ot{background:var(--ot-bg);color:var(--ot)}
button.pill{border:0;min-height:44px;padding:0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-size:15px;font-weight:500;min-height:44px}
.chip small{color:var(--ink2);font-weight:400;margin-left:4px}
.chip.on{border-color:var(--go);background:var(--go-bg);color:var(--go)}
.chip:disabled{cursor:default}
.btn{width:100%;min-height:48px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-weight:500;margin-top:10px}
.btn.dim{color:var(--ink2)}
.btn.warn{color:var(--bad);border-color:var(--bad)}
.btn.solid{background:var(--go);color:var(--on-go);border-color:var(--go)}
.btn.bk{width:auto;padding:0 14px;min-height:44px;margin:0 0 10px}
.seg{display:flex;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 8px;font-size:14px;font-weight:500;color:var(--ink2);min-height:44px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.fig{font:600 52px/1 var(--fd);font-variant-numeric:tabular-nums}
.fig small{font-size:22px;color:var(--ink2);margin-left:4px}
.meter{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line);margin:12px 0 8px}
.meter i{display:block;height:100%}
.meter .r{background:var(--go)}.meter .o{background:var(--ot-bar)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.row{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;min-height:44px}
.row:last-child{border-bottom:0}
.day{width:44px;flex:none}
.day b{display:block;font:600 22px/1 var(--fd)}
.day span{font-size:13px;color:var(--ink2)}
.mid{flex:1;min-width:0;font-size:15px}
.mid .sub{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{text-align:right;flex:none}
.rt b{font:600 24px/1 var(--fd);font-variant-numeric:tabular-nums}
.rt .pill{margin-top:4px;font-size:12px;padding:2px 8px}
.empty{color:var(--ink2);font-size:15px;padding:18px 0;text-align:center}
.dl{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:15px;font-variant-numeric:tabular-nums}
.dl.t{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:600;font-size:17px}
.dl span:first-child{color:var(--ink2)}
.dl.t span:first-child{color:var(--ink)}
label.f{display:block;font-size:13px;color:var(--ink2);margin:14px 0 5px}
input,select,textarea{width:100%;height:46px;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:0 12px;font-size:16px}
textarea{height:70px;padding:10px 12px;resize:none}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible,[role="button"]:focus-visible{outline:2px solid var(--go);outline-offset:1px}
.two{display:flex;gap:10px}.two>div{flex:1;min-width:0}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:18px}
.pv{background:var(--field);border:1px dashed var(--line);border-radius:12px;padding:12px;margin-top:14px;font-size:15px;font-variant-numeric:tabular-nums}
.rr{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.rr input:first-child{flex:1}.rr .rate{width:96px;flex:none}
.rr button{flex:none;width:46px;height:46px;border:1px solid var(--line);background:var(--card);border-radius:10px;color:var(--ink2);font-size:18px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 4px}
.nav button{width:44px;height:44px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-size:22px;flex:none}
.nav .mid2{flex:1;text-align:center;font:600 22px/1.1 var(--fd)}
.nav .mid2 small{display:block;font:400 13px var(--fb);color:var(--ink2);margin-top:2px}
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(440px,100%);display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px calc(4px + env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) calc(4px + env(safe-area-inset-left,0px))}
.tabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:500;color:var(--ink2);padding:6px 0;min-height:44px}
.tabs button.on{color:var(--go)}
.tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--stop);color:var(--on-stop);padding:10px 16px;border-radius:12px;font-size:15px;max-width:90%;z-index:6}
.upd{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--go);color:var(--on-go);border:0;border-radius:99px;padding:0 20px;min-height:44px;font-weight:600;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.foot{text-align:center;color:var(--ink2);font-size:12px;margin-top:22px}
.foot .fver{font:600 26px/1.1 var(--fd);color:var(--ink);margin-bottom:2px}.foot .fbuild{font-size:14px;color:var(--ink2);margin-bottom:12px}
.note{font-size:13px;color:var(--ink2);margin-top:6px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi .l{font-size:13px;color:var(--ink2)}
.kpi .v{font:600 34px/1.05 var(--fd);font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .v small{font-size:16px;color:var(--ink2);margin-left:3px}
.kpi .d{font-size:12px;color:var(--ink2);margin-top:3px}
.kpi.ot .v{color:var(--ot)}
.bars{display:flex;gap:3px;align-items:flex-end;height:140px;margin-top:6px}
.bc{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;border:0;background:transparent;padding:0}
.bc em{font:500 11px var(--fb);color:var(--ink2);font-style:normal;height:14px;line-height:14px}
.bc .b{width:100%;display:flex;flex-direction:column;border-radius:4px 4px 0 0;overflow:hidden}
.bc .b i{display:block}
.bc .b .r{background:var(--go)}.bc .b .o{background:var(--ot-bar)}
.bl{display:flex;gap:3px;margin-top:4px}
.bl span{flex:1;text-align:center;font-size:11px;color:var(--ink2)}
.bl span.td{color:var(--ink);font-weight:600}
.lg{display:flex;gap:14px;font-size:12px;color:var(--ink2);margin-top:10px;flex-wrap:wrap}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.pg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.pg .wd{font-size:11px;color:var(--ink2);text-align:center}
.pc{height:44px;border-radius:8px;border:1px solid var(--line);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;line-height:1.1}
.pc small{font-size:11px;color:var(--ink2)}
.pc b{font:600 15px var(--fd)}
.pc{position:relative}
.pc.m{border-color:transparent;color:var(--ink)}
.pc.f{border-style:dashed}
.pc.x{visibility:hidden}
.pc.un{border:1.5px dashed var(--bad)}
.pc.nw{background:var(--field)}
.pc .mu{font-weight:500;font-size:12px;color:var(--ink2)}
.pc u{position:absolute;top:2px;right:3px;font:700 11px var(--fb);text-decoration:none;background:var(--pay);color:var(--on-pay);border-radius:6px;padding:0 4px;line-height:15px}
.pc.td{outline:2px solid var(--ink);outline-offset:1px}
.pc.bt{min-height:62px;height:auto;padding:3px 0}.pc i{font:400 11px var(--fb);font-style:normal}
.pbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:12px}
.pbar i{display:block;height:100%;background:var(--go)}
.rng{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:2px}
.rng button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;color:var(--ink2);min-height:44px}
.rng button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.wh{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink2);padding:12px 0 6px;border-bottom:1px solid var(--line)}
.wh b{color:var(--ink);font-weight:600}
.tl{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;min-height:44px}
.tl.mt{cursor:default}
.tl .dn{width:42px;flex:none;font-size:13px;color:var(--ink2);line-height:1.1}
.tl .dn b{color:var(--ink);font:600 15px var(--fd);display:block}
.tl .tr{flex:1;min-width:0;height:26px;border-radius:6px;position:relative;background:linear-gradient(to right,transparent 24.8%,var(--line) 25%,transparent 25.2%,transparent 49.8%,var(--line) 50%,transparent 50.2%,transparent 74.8%,var(--line) 75%,transparent 75.2%),var(--field)}
.tl .sh{position:absolute;top:3px;bottom:3px;border-radius:5px;overflow:hidden;display:flex}
.tl .sh i{display:block;height:100%}
.tl .sh .r{background:var(--go)}.tl .sh .o{background:var(--ot-bar)}
.tl .hr{flex:none;text-align:right;font:600 16px var(--fd);font-variant-numeric:tabular-nums}
.tl .hr.z{color:var(--ink2);font-weight:400}
.ax{display:flex;gap:8px;margin-top:10px;font-size:11px;color:var(--ink2)}
.ax .sp{width:42px;flex:none}.ax .sc{flex:1;position:relative;height:14px}.ax .sc span{position:absolute;transform:translateX(-50%)}.ax .sc span:first-child{transform:none}.ax .hr{flex:none}
.tl .hr,.ax .hr{width:54px}
.hr em{font:400 12px var(--fb);font-style:normal;color:var(--ink2)}
.seg.t3{flex:none}.seg.t3 button{flex:none;padding:6px 11px}
.alert{display:block;background:var(--ot-bg);color:var(--ot);border-radius:14px;padding:12px 14px;margin-bottom:12px;cursor:pointer}
.alert b{display:block;font-weight:600}.alert span{font-size:14px}
.okbox{background:var(--go-bg);color:var(--go);border-radius:14px;padding:12px 14px;margin-top:14px}
.warnc{border-color:var(--ot)}
.why{font-size:15px;padding:8px 0;border-bottom:1px solid var(--line)}.why:last-child{border-bottom:0}
.esc{margin-top:14px;font-size:14px;color:var(--ink2)}.esc ol{margin:6px 0 0 18px;padding:0}.esc b{color:var(--ink)}
.lnk{display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.lines{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.job{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.kind{margin:-2px 0 12px}
.kind select{margin-top:6px}
.bl.b2{margin-top:2px}
.bl.bd{margin-top:0}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;margin-top:6px;font-size:15px;cursor:pointer}
.chk input{width:22px;height:22px;flex:none}
.sg{display:grid;grid-template-columns:48px 1fr 1fr 58px 44px;gap:6px;align-items:center;margin-bottom:6px}
.sg input{height:44px;padding:0 6px;font-size:15px;min-width:0}
.sg .ck{display:flex;align-items:center;justify-content:center;min-height:44px;cursor:pointer}
.sg .ck input{width:22px;height:22px}
.sg.hdr span{font-size:12px;color:var(--ink2)}
.sd{font-size:13px;color:var(--ink2);line-height:1.1}.sd b{display:block;color:var(--ink);font:600 16px var(--fd)}
.dchips{display:flex;gap:6px}
.dchips button{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 0;font-size:14px;font-weight:500;color:var(--ink2);min-height:44px}
.dchips button.on{background:var(--ot-bg);border-color:transparent;color:var(--ot)}
.file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
/* V1.1: the + button, the "Nothing logged" card, big time fields, legends, pay period cards, day tags. */
.fab{position:fixed;right:max(16px,calc((100vw - 440px)/2 + 16px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--go);color:var(--on-go);font:500 38px/1 var(--fd);display:flex;align-items:center;justify-content:center;padding:0 0 4px;box-shadow:0 0 0 4px var(--bg);z-index:4}
.log{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--go-bg);color:var(--go);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.log b{display:block;font-weight:600}.log span{font-size:14px}
.log .lgb{display:flex;flex-direction:column;gap:6px;flex:none}
.log button{border:0;background:var(--go);color:var(--on-go);border-radius:10px;padding:0 14px;min-height:44px;font-weight:600}
.log button.alt{background:transparent;color:var(--go);border:1px solid var(--go)}
.bt input{height:60px;font:600 32px var(--fd);text-align:center;letter-spacing:1px}
.lgd{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:12px;font-size:12px;color:var(--ink2)}
.lgd i.s{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:5px;vertical-align:-3px;font-style:normal}
.lgd i.r{background:var(--go-bg);border:1px solid var(--go)}.lgd i.o{background:var(--ot-bg);border:1px solid var(--ot)}
.lgd i.od{background:var(--off-bg)}.lgd i.hl{background:var(--hol-bg)}.lgd i.lv{background:var(--lv-bg)}
.lgd i.un{border:1.5px dashed var(--bad)}
.lgd i.pdy{background:var(--pay);color:var(--on-pay);font:700 10px/14px var(--fb);text-align:center}
.lgd i.mix{background:linear-gradient(135deg,var(--off-bg) 0 34%,var(--hol-bg) 34% 67%,var(--ot-bg) 67% 100%)}
.bc .b .c{background:var(--hol-fg)}.bc .b .v{background:var(--lv-fg)}
.bl.bd span.pdy{background:var(--pay);color:var(--on-pay);border-radius:7px;font-weight:700}
.pcard{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;min-height:44px}
.pcard.on{border-color:var(--go);box-shadow:0 0 0 1px var(--go)}
.pcard b{display:block;font:600 20px var(--fd)}.pcard span{font-size:13px;color:var(--ink2)}
.pcard .r{text-align:right;flex:none}.pcard .r b{font-size:22px}.pcard .r .pill{margin-top:4px}
.pill.hol{background:var(--hol-bg);color:var(--hol-fg)}.pill.lv{background:var(--lv-bg);color:var(--lv-fg)}
.btn.big2{min-height:54px;font-size:18px}
/* V1.2.1: behave like an app: no double-tap zoom, no text-selection callouts on the controls. */
html{touch-action:manipulation}
body{-webkit-touch-callout:none}
button,[role="button"],nav,.row,.pcard,.pc,.chip{-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
/* V1.3: tab purposes, the run card, open shifts, the Shifts filter strips, row buttons, the delete pop-up, the error bar. */
.purpose{font-size:14px;color:var(--ink2);margin-top:2px}
.busbox{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:16px}
.busbox h3{font:600 20px var(--fd);margin:0}
.lx{border:0;background:none;color:var(--ot);font-size:14px;font-weight:600;padding:6px 4px;min-height:44px}
.chips.mini{margin-top:6px}.chips.mini .chip{padding:5px 11px;font-size:14px}
.brkh{font:600 20px var(--fd);margin:0}
.brk{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}.brk+.brk{margin-top:16px}

.pbr{display:flex;gap:8px;align-items:center;margin-top:8px}.pbr input{flex:1;min-width:0;width:auto;padding:0 8px;text-align:center}.pbr span,.pbr .lx{flex:none}

<script id="model">
/* Pay model: pure functions over the state object A. No DOM here; test.js runs this block in Node. */

function pad(n){return (n<10?'0':'')+n;}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}

function eom(d){return new Date(d.getFullYear(),d.getMonth()+1,0);}
function fmtD(d){return MN[d.getMonth()]+' '+d.getDate();}

function hhmm(d){return pad(d.getHours())+':'+pad(d.getMinutes());}
function nm(h){return String(Math.round(h*100)/100);}
function n1(h){return String(Math.round(h*10)/10);}
function usd(n){return n.toLocaleString('en-US',{style:'currency',currency:'USD'});}
function usd0(n){return n.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});}

function tvalid(v){return /^([01]\d|2[0-3]):[0-5]\d$/.test(v||'');}
/* Typed time to HH:MM: 7 -> 07:00, 730 -> 07:30, 1400 -> 14:00. Out-of-range input stays as typed so tvalid rejects it. */
function tfix(v){var d=String(v||'').replace(/[^0-9]/g,'').slice(0,4);if(!d)return '';if(d.length<=2)d=('0'+d).slice(-2)+'00';else if(d.length===3)d='0'+d;var h=+d.slice(0,2),m=+d.slice(2,4);if(h>23||m>59)return d.slice(0,2)+':'+d.slice(2);return pad(h)+':'+pad(m);}

function jobOf(id){for(var i=0;i<A.jobs.length;i++)if(A.jobs[i].id===id)return A.jobs[i];return null;}
function jr(jid){return (jobOf(jid)||A.jobs[0]).rules;}
function curJob(){return U.job==='all'?A.jobs[0]:(jobOf(U.job)||A.jobs[0]);}
function role(id){for(var i=0;i<A.roles.length;i++)if(A.roles[i].id===id)return A.roles[i];return null;}
function roleJob(rid){var r=role(rid);return r?r.job:A.jobs[0].id;}
function firstWork(jid){var r=A.roles.filter(function(x){return x.kind==='work'&&(!jid||x.job===jid);})[0];return r?r.id:A.roles[0].id;}
function newRules(pp){var t=ymd(now());return {mode:'auto',thr:40,mult:1.5,ws:1,dOn:false,dHrs:8,wOn:true,offOT:true,off:{sched:[{from:'2000-01-01',days:[]}],next:''},hol:{on:true,list:[]},guar:0,bank:{on:false,cap:80,bal:80,date:t},pp:pp||{type:'biweekly',anchor:t,lag:7},third:false};}
function bindSet(){['mode','thr','mult','ws','dOn','dHrs','wOn','guar','bank','pp'].forEach(function(k){Object.defineProperty(A.set,k,{get:function(){return curJob().rules[k];},set:function(v){curJob().rules[k]=v;},enumerable:false,configurable:true});});}
function useState(s){A=s;REV++;MC.k=null;bindSet();}

/* Stored-data versions. Unversioned state is the V1 shape. Version 2 added schemaVersion and marks (days marked
   "did not work"). Version 3 (V1.3) adds optional fields on a shift: the run card (duty, route, run, coach), paid
   breaks (pb, a record only) and open (saved with no end yet). It also retires the live clock: a clock session stored
   in sess becomes one open shift and sess is cleared. Every other part passes through untouched, and the break
   setting is never changed here. Runs on load and on import, before norm(). Re-running it changes nothing. Data from
   a newer app returns null. */
function migrate(s){
  if(!s||typeof s!=='object')return null;
  var v=s.schemaVersion==null?1:+s.schemaVersion;
  if(!(v>=1)||v>SCHEMA)return null;
  if(v===SCHEMA&&Array.isArray(s.marks)&&!s.sess)return s;
  var o={};for(var k in s)o[k]=s[k];
  o.schemaVersion=SCHEMA;if(!Array.isArray(o.marks))o.marks=[];
  if(o.sess){var x=sessShift(o.sess,o);if(x)o.entries=(Array.isArray(o.entries)?o.entries:[]).concat([x]);o.sess=null;}
  return o;
}
/* A running clock session from before V1.3, as an open shift: its date, start and work type, no end yet. The break
   is the one logged on the clock, or the automatic break setting when none was logged (as clocking out did). */
function sessShift(ss,o){
  var t=+ss.start;if(!(t>0))return null;
  var d=new Date(t),L=Array.isArray(o.entries)?o.entries:[],id='e'+t;
  while(L.some(function(e){return e&&e.id===id;}))id+='x';
  var b=(+ss.brkMs>0||ss.brkStart)?Math.round((+ss.brkMs||0)/60000):(+(o.set&&o.set.brk)||0);
  return {id:id,date:ymd(d),s:hhmm(d),e:'',b:b,role:ss.role,ot:null,adj:0,note:'',open:true};
}
/* Fill in anything a stored, imported or brand-new state is missing. Generic defaults only. */

  set.rem=Object.assign({inOn:false,inT:'06:30',outOn:false,outH:10},set.rem||{});

  });

    var o=Object.assign({},r);o.rate=+o.rate||0;o.kind=o.kind==='leave'?'leave':'work';o.ot=o.kind==='work';o.name=String(o.name==null?'':o.name);return o;});

  var ents=(Array.isArray(s.entries)?s.entries:[]).filter(function(e){return e&&e.id&&/^\d{4}-\d\d-\d\d$/.test(e.date||'')&&tvalid(e.s)&&(tvalid(e.e)||(e.open===true&&!e.e));});
  var marks=(Array.isArray(s.marks)?s.marks:[]).filter(function(m){return m&&/^\d{4}-\d\d-\d\d$/.test(m.date||'');});
  return {schemaVersion:SCHEMA,set:set,jobs:jobs,roles:roles,entries:ents,marks:marks,sess:s.sess||null,w2:Object.assign({box1:'',tt:''},s.w2||{}),
    contacts:Object.assign({me:'',payName:'',payEmail:'',unionName:'',unionEmail:''},s.contacts||{}),stubs:Array.isArray(s.stubs)?s.stubs.filter(function(b){return b&&b.ps;}):[]};
}
function fresh(){return norm({jobs:[{id:'j1',name:'My job'}],roles:[{id:'r1',job:'j1',name:'Regular work',rate:0,kind:'work',ot:true}]});}

function wmin(e){var d=tmin(e.e)-tmin(e.s)-(+e.b||0);if(tmin(e.e)<=tmin(e.s))d+=1440;return Math.max(0,d);}
function wh(e){return wmin(e)/60;}
/* openOk: a shift may be saved open (a start and no end yet); it is never counted until it has an end. */
function entryErr(E,openOk){
  if(openOk&&!E.e){if(!E.date||!E.s)return 'Enter a date and a start time.';if(!tvalid(E.s))return 'Use 24-hour time, like 14:00.';return pbErr(E);}
  if(!E.date||!E.s||!E.e)return 'Enter a date, start time, and end time.';if(!tvalid(E.s)||!tvalid(E.e))return 'Use 24-hour time, like 14:00.';if(wmin(E)<=0)return 'Those times leave no paid time. Check the break.';if(E.ot!=null&&E.ot>wmin(E)/60)return 'Overtime can\'t be more than the hours worked.';return pbErr(E);
}
/* Paid breaks are a record only and never change pay, but each one needs both times in 24-hour form. */
function pbErr(E){return (E.pb||[]).some(function(p){return (p.f||p.t)&&!(tvalid(p.f)&&tvalid(p.t));})?'Give each paid break a start and an end in 24-hour time, like 12:30.':cardErr(E);}
/* The optional From and To on run cards 2 and up: a note only, but when typed they must be 24-hour times. */
function cardErr(E){var L=Array.isArray(E.cards)?E.cards:[];for(var i=0;i<L.length;i++){var c=L[i]||{};if((c.f&&!tvalid(c.f))||(c.t&&!tvalid(c.t)))return 'Run card '+(i+2)+': use 24-hour time, like 14:00.';}return '';}

function calc(list){
  var cr={},cd={},G={},rows=[];
  list.forEach(function(e){
    var r=role(e.role),job=r?r.job:A.jobs[0].id,R=jr(job),counts=r?r.ot!==false:true,wk=ymd(wkStart(pd(e.date),job))+'|'+job,dk=e.date+'|'+job;
    var w=wh(e),ot=0,dayOff=counts&&R.offOT!==false&&isOff(job,e.date);
    if(counts){
      var c1=cr[wk]||0,d0=cd[dk]||0;
      if(e.ot!=null)ot=Math.min(w,Math.max(0,+e.ot||0));
      else if(dayOff)ot=w;
      else if(R.mode==='auto'){
        var dOT=R.dOn?Math.max(0,Math.min(w,d0+w-R.dHrs)):0,reg=w-dOT,wOT=R.wOn!==false?Math.max(0,Math.min(reg,c1+reg-R.thr)):0;

    rows.push(row);
    if(counts){var g=G[wk]||(G[wk]={w:0,ot:0,rows:[]});g.w+=w;g.ot+=ot;g.rows.push(row);}
  });

  return rows;
